[project]
name = "origin"
version = "0.3.0"
description = "Asistente de voz bilingüe (ES/EN) con GUI, TTS, HOTAS y fallback LLM para Star Citizen"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "faster-whisper>=1.0.3",
    "sounddevice>=0.4.7",
    "numpy>=1.26",
    "pynput>=1.7.7",
    "rapidfuzz>=3.10",
    "pyyaml>=6.0.2",
    "pydantic>=2.9",
    "PySide6>=6.7",
    "watchdog>=4.0",
    "httpx>=0.27",
    # pydirectinput / inputs son Windows-only; el engine y los tests funcionan en Linux para dev
    "pydirectinput>=1.0.4 ; sys_platform == 'win32'",
    "inputs>=0.5 ; sys_platform == 'win32'",
    # Head tracking por webcam (clon de Beam). Deps de CV pesadas, Windows-only:
    # el engine importa lazy y los tests usan el backend 'mock', así que corren
    # en Linux sin cv2/mediapipe.
    "opencv-python>=4.9 ; sys_platform == 'win32'",
    "mediapipe>=0.10 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "pytest-qt>=4.4",
    "pytest-httpx>=0.30",
    "pyinstaller>=6.10",
    "ruff>=0.7",
]

[project.scripts]
origin = "origin.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["origin"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["gui: requiere display Qt / pytest-qt"]
