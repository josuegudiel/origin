# Preset bilingüe v0.3 para Origin — Star Citizen 4.x.
# Las teclas son binds default; verificalos contra los tuyos desde
# RSI Keybindings y ajustalos desde el dashboard o editando este YAML.
# Frases en ES son las que un piloto realmente dice — no traducciones literales.
version: 3
settings:
  ptt_key: f12
  profile_switch_hotkey: ctrl+f12
  ui_language: es
  active_profile: flight
  whisper_model: small
  whisper_device: auto
  whisper_compute_type: auto
  active_language: es
  fuzz_threshold: 75
  mic_device: null
  sample_rate: 16000
  max_record_seconds: 8
  inter_key_delay_ms: 30
  log_format: pretty
  start_minimized: false
  autostart_windows: false
  theme: system
  tts:
    enabled: true
    voice_es: "es_ES-mls_10246-low"
    voice_en: "en_US-amy-low"
    default_response_when_no_say: true
    cancel_on_ptt: true
    speed: 1.0
    volume: 1.0
  hotas:
    enabled: false
    button_binding: null
    poll_hz: 60
  llm:
    enabled: false
    base_url: "http://localhost:11434"
    model: "llama3.1:8b"
    timeout_ms: 8000
    floor_score: 60
    temperature: 0.2
    max_commands_per_resolution: 5

