  # ============================================================
  - id: voice_misc
    label_es: "Misceláneos"
    label_en: "Misc"
    description_es: "Comandos generales sin contexto específico."
    description_en: "General commands without specific context."
    commands:
      - id: yes_confirm
        phrases_es: ["sí", "confirma", "acepta"]
        phrases_en: ["yes", "confirm", "accept"]
        keys: ["y"]
        label_es: "Sí"
        label_en: "Yes"
      - id: no_cancel
        phrases_es: ["no", "cancela"]
        phrases_en: ["no", "cancel"]
        keys: ["n"]
        label_es: "No"
        label_en: "No"
      - id: continue_action
        phrases_es: ["continuar", "continue"]
        phrases_en: ["continue"]
        keys: ["enter"]
        label_es: "Continue"
        label_en: "Continue"
      - id: cancel_action
        phrases_es: ["cancelar acción", "abort"]
        phrases_en: ["abort", "cancel action"]
        keys: ["esc"]
        label_es: "Abort"
        label_en: "Abort"
      - id: pause_game
        phrases_es: ["pausa", "menú"]
        phrases_en: ["pause", "menu"]
        keys: ["esc"]
        label_es: "Pause"
        label_en: "Pause"
      - id: free_cam
        phrases_es: ["cámara libre", "free cam"]
        phrases_en: ["free cam"]
        keys: ["f4"]
        label_es: "Free cam"
        label_en: "Free cam"
      - id: third_person
        phrases_es: ["tercera persona", "3rd person"]
        phrases_en: ["third person", "3rd person"]
        keys: ["f4"]
        label_es: "3rd person"
        label_en: "3rd person"
      - id: first_person
        phrases_es: ["primera persona", "1st person"]
        phrases_en: ["first person", "1st person"]
        keys: ["f4"]
        label_es: "1st person"
        label_en: "1st person"
      - id: record_replay
        phrases_es: ["graba replay", "record"]
        phrases_en: ["record replay"]
        keys: ["f10"]
        label_es: "Record"
        label_en: "Record"
      - id: toggle_hud
        phrases_es: ["esconde hud", "toggle hud"]
        phrases_en: ["toggle hud", "hide hud"]
        keys: ["alt+0"]
        label_es: "Toggle HUD"
        label_en: "Toggle HUD"
      - id: zoom_in_hud
        phrases_es: ["zoom in", "acerca hud"]
        phrases_en: ["zoom in"]
        keys: ["pageup"]
        label_es: "Zoom in"
        label_en: "Zoom in"
      - id: zoom_out_hud
        phrases_es: ["zoom out", "aleja hud"]
        phrases_en: ["zoom out"]
        keys: ["pagedown"]
        label_es: "Zoom out"
        label_en: "Zoom out"
